<script>
    // Common weak passwords to check against
    const COMMON = ["password", "123456", "qwerty", "admin", "welcome", "password123", "letmein", "monkey"];

    // Cache HTML elements
    const pwd = document.getElementById("pwd");
    const toggleBtn = document.getElementById("toggleBtn");
    const results = document.getElementById("results");
    const scoreText = document.getElementById("scoreText");
    const bar = document.getElementById("bar");
    const strengthBadge = document.getElementById("strengthBadge");
    const riskBadge = document.getElementById("riskBadge");
    const problemsBox = document.getElementById("problems");
    const tipsBox = document.getElementById("tips");
    const noProblems = document.getElementById("noProblems");

    // 1. Show/Hide Password
    toggleBtn.onclick = () => {
        const isHidden = pwd.type === "password";
        pwd.type = isHidden ? "text" : "password";
        toggleBtn.textContent = isHidden ? "Hide" : "Show";
    };

    // 2. Main Evaluation Function
    pwd.oninput = () => {
        const val = pwd.value;

        // Hide results if input is empty
        if (!val) {
            results.className = "results";
            return;
        }
        results.className = "results show";

        let score = 0;
        const problems = [];
        const tips = [];

        // Check Length
        if (val.length >= 16) score += 45;
        else if (val.length >= 12) score += 35;
        else if (val.length >= 8) score += 20;
        else {
            score -= 20;
            problems.push("Too short (use at least 8 characters)");
            tips.push("Make it at least 8 characters. 12 or more is better.");
        }

        // Check Character Diversity (10 pts each, +15 for symbols)
        if (/[a-z]/.test(val)) score += 10; else { problems.push("No lowercase letters"); tips.push("Add lowercase letters (a-z)."); }
        if (/[A-Z]/.test(val)) score += 10; else { problems.push("No UPPERCASE letters"); tips.push("Add uppercase letters (A-Z)."); }
        if (/[0-9]/.test(val)) score += 10; else { problems.push("No numbers"); tips.push("Add numbers (0-9)."); }
        if (/[^A-Za-z0-9]/.test(val)) score += 15; else { problems.push("No special characters"); tips.push("Add a symbol like # @ ! %"); }

        // Check Bad Patterns (-15 pts each)
        if (/(.)\1\1\1/.test(val)) {
            score -= 15;
            problems.push("Has repeated characters (like aaaa or 1111)");
        }
        if (/1234|abcd|qwer|asdf/i.test(val)) {
            score -= 15;
            problems.push("Has a simple sequence (like 1234, abcd, or qwer)");
        }
        if (/^[a-zA-Z]+[0-9]{2,4}$/.test(val) \vert{}\vert{} /^[0-9]+$/.test(val)) {
            score -= 15;
            problems.push("Looks like letters plus a year, or numbers only");
        }

        // Check Common Passwords (Hard Cap at 10)
        const clean = val.toLowerCase().replace(/[@4]/g, "a").replace(/[0]/g, "o").replace(/[1!]/g, "i").replace(/[$5]/g, "s");
        if (COMMON.some(bad => val.toLowerCase().includes(bad) || clean.includes(bad))) {
            problems.push("This is a common password");
            score = Math.min(score, 10);
        }

        // Keep score strictly between 0 and 100
        score = Math.max(0, Math.min(100, score));

        // Update UI
        scoreText.textContent = `${score} / 100`;
        bar.style.width = `${score}%`;

        let strength = "Very Weak", risk = "High", statusClass = "bad", barColor = "";
        if (score >= 75) {
            strength = "Strong"; risk = "Low"; statusClass = "ok"; barColor = "green";
        } else if (score >= 50) {
            strength = "Medium"; risk = "Medium"; statusClass = "warn"; barColor = "orange";
        } else if (score >= 25) {
            strength = "Weak";
        }

        bar.className = `bar ${barColor}`;
        strengthBadge.textContent = `Strength: ${strength}`;
        riskBadge.textContent = `Risk: ${risk}`;
        strengthBadge.className = `badge ${statusClass}`;
        riskBadge.className = `badge ${statusClass}`;

        // Render Problems & Tips
        noProblems.style.display = problems.length === 0 ? "block" : "none";
        problemsBox.innerHTML = problems.map(p => `<li>${p}</li>`).join("");
        tipsBox.innerHTML = tips.length ? tips.map(t => `<li>${t}</li>`).join("") : "<li>Looks mixed and long. Still never reuse it across sites.</li>";
    };
</script>
